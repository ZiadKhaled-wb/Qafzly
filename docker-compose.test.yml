version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: qafzly-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qafzly_test
    ports:
      - "5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    container_name: qafzly-redis-test
    ports:
      - "6380:6379"

volumes:
  postgres_test_data: